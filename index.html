<style>
  /* =====================================================================
     TOKENS (siehe design-system.html)
     ===================================================================== */
  :root {
    /* Grün */
    --c-forest: #075033;      /* Tiefgrün: Überschriften, Straße, dunkle Flächen. Weiß darauf 9,5:1 */
    --c-forest-dark: #043623; /* Hover auf Tiefgrün */
    --c-green: #187E4B;       /* Aktionsgrün: Primär-Button, Nummern. Weiß darauf 5,1:1 */
    --c-green-hover: #12603A; /* Hover Aktionsgrün */
    --c-mint: #36F39B;        /* Signal-Akzent, nur als Fläche mit Tiefgrün-Text (6,6:1) */
    --c-mint-soft: #E3FBEE;   /* Zitat gut, Hover-Fläche */
    /* Neutral */
    --c-ink: #1A1A1A;         /* Fließtext, 17,4:1 auf Weiß */
    --c-muted: #5A5A5A;       /* Nebentext, 6,9:1 auf Weiß, 6,2:1 auf Fläche */
    --c-line: #E1E1E1;        /* Trennlinien */
    --c-surface: #F3F3F3;     /* Kachel-Fläche */
    --c-paper: #FFFFFF;       /* Seite */
    /* Status */
    --c-crit: #B3384F;        /* Kante Zitat kritisch */
    --c-crit-soft: #FCEBEE;   /* Fläche Zitat kritisch */
    --c-late: #8A4B00;        /* Text Hinweis „spät“, 6,1:1 auf --c-late-soft */
    --c-late-soft: #FFF0DC;
    --c-star: #9A6700;        /* Stern-Symbol, 4,9:1 auf Weiß */
    /* Typografie: nur Systemschriften */
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --fs-xs: .75rem;          /* 12 Quellen */
    --fs-sm: .8125rem;        /* 13 Hinweise, Fußzeile */
    --fs-s: .875rem;          /* 14 Kartentext, Buttons */
    --fs-m: 1rem;             /* 16 Basis */
    --fs-l: 1.125rem;         /* 18 Intro, Kartentitel */
    --fs-xl: 1.3125rem;       /* 21 */
    --fs-2xl: clamp(1.5rem, 1.15rem + 1.4vw, 2rem);      /* 24 bis 32 Abschnitts-Titel */
    --fs-3xl: clamp(2.25rem, 1.5rem + 3.4vw, 3.75rem);   /* 36 bis 60 Seitentitel */
    --fw-regular: 400;
    --fw-semi: 600;
    --fw-bold: 700;
    --lh-tight: 1.08;
    --lh-body: 1.5;
    /* Abstände, 4er-Raster */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 72px;
    --gutter: clamp(16px, 4vw, 40px);
    --maxw: 1280px;
    /* Radien: eckig als Grundsatz */
    --r-0: 0;
    --r-1: 2px;
    --r-pill: 999px;
    /* Schatten: flach, nur bei Hover */
    --sh-1: 0 1px 2px rgba(0, 0, 0, .06);
    --sh-2: 0 12px 28px rgba(0, 0, 0, .10);
    --t: .18s ease;
  }

  /* ---------- Basis ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font); font-size: var(--fs-m); line-height: var(--lh-body); color: var(--c-ink); background: var(--c-paper); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; }
  a { color: var(--c-green); text-underline-offset: 3px; }
  a:hover { color: var(--c-forest); }
  :focus-visible { outline: 3px solid var(--c-forest); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
  h1, h2, h3 { text-wrap: balance; }
  p, blockquote, figcaption, .svc-item span { text-wrap: pretty; }
  .eyebrow { margin: 0 0 var(--s-2); font-size: var(--fs-sm); font-weight: var(--fw-semi); letter-spacing: .08em; text-transform: uppercase; color: var(--c-ink); }
  h2.sec { margin: 0 0 var(--s-2); font-size: var(--fs-2xl); line-height: 1.15; letter-spacing: -.015em; font-weight: var(--fw-semi); color: var(--c-forest); }
  .hint { margin: 0 0 var(--s-4); color: var(--c-muted); font-size: var(--fs-s); }
  section.block { padding-top: var(--s-8); }

  /* ---------- Hero ---------- */
  .hero { padding: var(--s-7) 0 0; }
  .hero-grid { display: grid; gap: var(--s-6); align-items: center; }
  .hero h1 { margin: 0 0 var(--s-4); font-size: var(--fs-3xl); line-height: var(--lh-tight); letter-spacing: -.03em; font-weight: var(--fw-semi); color: var(--c-forest); }
  .hero h1 .dot { color: var(--c-green); }
  .intro { margin: 0; max-width: 34em; font-size: var(--fs-l); color: var(--c-ink); }
  .when { display: inline-flex; align-items: center; gap: var(--s-2); margin: var(--s-5) 0 0; padding: 6px 12px; border-radius: var(--r-1); background: var(--c-mint); color: var(--c-forest); font-weight: var(--fw-bold); font-size: var(--fs-s); }
  .mosaic { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 0; }
  .mosaic .tile { position: relative; margin: 0; aspect-ratio: 1; overflow: hidden; background: var(--c-forest); }
  .mosaic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile-nr { position: absolute; left: 0; bottom: 0; min-width: 30px; height: 30px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; background: var(--c-green); color: #fff; font-weight: var(--fw-bold); font-size: var(--fs-s); }
  @media (min-width: 640px) { .mosaic .tile { aspect-ratio: 4 / 3; } }
  @media (min-width: 1000px) {
    .hero { padding-top: var(--s-8); }
    .hero-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-7); }
    .mosaic { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mosaic .tile { aspect-ratio: 4 / 3; }
    .tile-nr { min-width: 36px; height: 36px; font-size: var(--fs-m); }
  }

  /* ---------- Segment-Umschalter ---------- */
  .origin { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); margin: var(--s-5) 0 var(--s-4); }
  .origin-lbl { font-size: var(--fs-s); font-weight: var(--fw-semi); color: var(--c-ink); }
  .seg { display: inline-flex; border: 2px solid var(--c-forest); background: var(--c-paper); }
  .origin-btn { font: inherit; font-size: var(--fs-s); font-weight: var(--fw-semi); min-height: 44px; padding: 0 var(--s-5); border: 0; background: transparent; color: var(--c-forest); cursor: pointer; transition: background var(--t); }
  .origin-btn + .origin-btn { border-left: 2px solid var(--c-forest); }
  .origin-btn:hover { background: var(--c-mint-soft); }
  .origin-btn[aria-pressed="true"] { background: var(--c-forest); color: #fff; }
  .origin-btn:focus-visible { outline-offset: 4px; }
  @media (max-width: 480px) {
    .seg { display: flex; width: 100%; }
    .origin-btn { flex: 1; padding: 0 var(--s-2); }
  }

  /* ---------- Strecken-Grafik ---------- */
  .b-route { background: var(--c-surface); padding: var(--s-5) var(--s-4) var(--s-3); }
  .b-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .b-svg-h { max-width: 1060px; margin: 0 auto; }
  .b-svg-v { display: none; max-width: 380px; margin: 0 auto; }
  .b-svg text { font-family: var(--font); fill: var(--c-ink); }
  .b-svg .city { font-weight: var(--fw-bold); font-size: 17px; }
  .b-svg .who { font-size: 13px; fill: var(--c-muted); font-weight: var(--fw-regular); }
  .b-svg .mid { font-size: 12px; fill: var(--c-muted); font-weight: var(--fw-semi); letter-spacing: .1em; text-transform: uppercase; paint-order: stroke; stroke: var(--c-surface); stroke-width: 5px; stroke-linejoin: round; }
  .b-svg .road { stroke: var(--c-forest); stroke-width: 6; }
  .b-svg .midline { stroke: var(--c-muted); stroke-width: 2; stroke-dasharray: 4 4; }
  .b-svg .midline.faint { stroke: #ABABAB; }
  .b-svg .tick { stroke: var(--c-surface); stroke-width: 3; }
  .b-svg .stem { stroke: var(--c-green); stroke-width: 1.5; fill: none; }
  .b-svg .end { fill: var(--c-forest); }
  .b-svg .favt { fill: var(--c-star); }
  .b-pt { cursor: pointer; }
  .b-pt .pin { fill: var(--c-green); stroke: var(--c-surface); stroke-width: 3; transition: fill var(--t); }
  .b-pt .num { fill: #fff; font-weight: var(--fw-bold); font-size: 15px; }
  .b-pt .name, .b-pt .sub { paint-order: stroke; stroke: var(--c-surface); stroke-width: 5px; stroke-linejoin: round; }
  .b-pt .name { font-weight: var(--fw-semi); font-size: 15px; }
  .b-pt .sub { font-size: 12.5px; fill: var(--c-muted); }
  .b-pt:hover .pin, .b-pt:focus .pin { fill: var(--c-forest); }
  .b-pt:focus-visible { outline: none; }
  .b-pt:focus-visible .pin { stroke: var(--c-ink); }
  .b-pt:hover .name, .b-pt:focus-visible .name { text-decoration: underline; }
  .b-svg-v .b-pt .name { font-size: 17px; }
  .b-svg-v .b-pt .sub { font-size: 14.5px; }
  .b-svg-v .city { font-size: 19px; }
  .b-cap { font-size: var(--fs-sm); color: var(--c-muted); margin: var(--s-2) var(--s-1) var(--s-1); }
  @media (max-width: 800px) { .b-svg-h { display: none; } .b-svg-v { display: block; } }

  /* ---------- Karten ---------- */
  .b-cards { display: grid; grid-template-columns: 1fr; gap: var(--s-4); margin-top: var(--s-5); }
  @media (min-width: 700px) { .b-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .b-card { position: relative; background: var(--c-surface); display: flex; flex-direction: column; scroll-margin-top: 16px; transition: box-shadow var(--t); }
  .b-card:hover { box-shadow: var(--sh-2); }
  .b-card.flash { outline: 4px solid var(--c-green); outline-offset: 0; }
  .b-card .media { aspect-ratio: 16 / 9; }
  .media { position: relative; overflow: hidden; background: var(--c-forest); }
  .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--c-forest); color: #fff; }
  .ph .ph-ort { font-size: 1.35rem; font-weight: var(--fw-bold); text-align: center; padding: 0 12px; line-height: 1.15; }
  .ph small { font-size: var(--fs-xs); }
  .fav-badge { position: absolute; z-index: 2; left: 0; top: 0; padding: 6px 12px; background: var(--c-mint); color: var(--c-forest); font-size: var(--fs-sm); font-weight: var(--fw-bold); }
  .b-body { padding: var(--s-4) var(--s-5) var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); flex: 1; }
  .b-title { display: flex; gap: var(--s-3); align-items: center; }
  .nr { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none; background: var(--c-green); color: #fff; font-weight: var(--fw-bold); font-size: var(--fs-l); }
  .b-title h3 { margin: 0; font-size: var(--fs-l); line-height: 1.25; font-weight: var(--fw-semi); color: var(--c-forest); }
  .b-title small { display: block; color: var(--c-muted); font-size: var(--fs-sm); }
  .b-meta { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3); align-items: center; font-size: var(--fs-s); }
  .stars { font-weight: var(--fw-bold); color: var(--c-ink); white-space: nowrap; }
  .stars .s { color: var(--c-star); }
  .cnt { color: var(--c-muted); }
  .b-meta .do { font-weight: var(--fw-semi); }
  .late { display: inline-block; padding: 1px 8px; border-radius: var(--r-1); background: var(--c-late-soft); color: var(--c-late); font-size: var(--fs-sm); font-weight: var(--fw-semi); white-space: nowrap; }
  .split-lbl { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 var(--s-2); font-size: var(--fs-sm); margin-bottom: var(--s-1); }
  .split-lbl .k::before, .split-lbl .r::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; background: var(--c-forest); }
  .split-lbl .r::before { background: var(--c-mint); outline: 1px solid var(--c-green); outline-offset: -1px; }
  .split { display: flex; height: 6px; gap: 2px; }
  .split .sk { background: var(--c-forest); }
  .split .sr2 { background: var(--c-mint); }
  .home { margin: var(--s-2) 0 0; font-size: var(--fs-sm); color: var(--c-muted); }
  .home b { color: var(--c-ink); }
  .q { margin: 0; padding: var(--s-2) var(--s-3); background: var(--c-mint-soft); border-left: 3px solid var(--c-green); font-size: var(--fs-s); }
  .q.crit { background: var(--c-crit-soft); border-left-color: var(--c-crit); }
  .q blockquote { margin: 0 0 3px; }
  .q figcaption { font-size: var(--fs-xs); color: var(--c-muted); }
  .q.none { background: none; border-left: 0; padding: 2px 0; color: var(--c-muted); font-size: var(--fs-sm); font-style: italic; }
  .tiny { font-size: var(--fs-sm); color: var(--c-muted); margin: 0; }
  .links { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: auto; padding-top: var(--s-1); }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 var(--s-4); border-radius: var(--r-0); font-size: var(--fs-s); font-weight: var(--fw-semi); text-decoration: none; transition: background var(--t), color var(--t); }
  .btn svg { flex: none; }
  .btn-primary { background: var(--c-green); color: #fff; }
  .btn-primary:hover { background: var(--c-green-hover); color: #fff; }
  .btn-ghost { background: var(--c-paper); color: var(--c-forest); box-shadow: inset 0 0 0 2px var(--c-forest); }
  .btn-ghost:hover { background: var(--c-forest); color: #fff; }

  /* Desktop: vier Spalten, Zeilen über alle Karten ausgerichtet */
  @media (min-width: 1100px) {
    .b-cards { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-4); }
    .b-cards .b-card .media { aspect-ratio: 4 / 3; }
    .b-card .b-body { padding: var(--s-4) var(--s-4) var(--s-5); }
    .b-card .b-title h3 { font-size: var(--fs-m); }
    .b-card .b-meta { font-size: var(--fs-sm); gap: 2px var(--s-2); }
    .b-card .q { font-size: var(--fs-sm); }
    .b-card .btn { padding: 0 var(--s-3); font-size: var(--fs-sm); min-height: 40px; }
  }
  @supports (grid-template-rows: subgrid) {
    @media (min-width: 1100px) {
      .b-cards .b-card { display: grid; grid-row: span 8; grid-template-rows: subgrid; row-gap: var(--s-3); }
      .b-cards .b-body { display: contents; }
      .b-cards .b-body > * { margin-left: var(--s-4); margin-right: var(--s-4); }
      .b-cards .b-body > :first-child { margin-top: var(--s-2); }
      .b-cards .b-body > .q { align-self: start; }
      .b-cards .b-body > :last-child { margin-bottom: var(--s-5); align-self: end; }
    }
  }

  /* ---------- CTA-Band ---------- */
  .cta-band { margin-top: var(--s-7); background: var(--c-forest); color: #fff; }
  .cta-band .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-3) var(--s-5); padding-top: var(--s-6); padding-bottom: var(--s-6); }
  .nobr { white-space: nowrap; }
  .cta { margin: 0; text-wrap: balance; font-size: var(--fs-2xl); font-weight: var(--fw-semi); line-height: 1.2; letter-spacing: -.01em; }
  .cta-nums { display: flex; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .cta-nums .cn { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 40px; height: 40px; background: var(--c-mint); color: var(--c-forest); font-weight: var(--fw-bold); font-size: var(--fs-l); }

  /* ---------- Service-Check ---------- */
  .svc-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 4px; }
  @media (min-width: 700px) { .svc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1100px) { .svc-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .svc-item { display: flex; gap: var(--s-3); align-items: flex-start; background: var(--c-surface); padding: var(--s-5) var(--s-4); }
  .svc-item b { display: block; margin-bottom: 2px; color: var(--c-forest); font-weight: var(--fw-semi); }
  .svc-item span:not(.svc-nr) { font-size: var(--fs-s); }
  .svc-nr { flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: var(--c-paper); box-shadow: inset 0 0 0 2px var(--c-green); color: var(--c-forest); font-weight: var(--fw-bold); font-size: var(--fs-sm); }

  /* ---------- Fußzeile ---------- */
  .foot { margin-top: var(--s-8); border-top: 1px solid var(--c-line); }
  .foot .wrap { padding-top: var(--s-5); padding-bottom: var(--s-6); color: var(--c-muted); font-size: var(--fs-sm); }
  .foot p { margin: 0; }

  /* =====================================================================
     Kopfzeile, Einstieg und Streifen
     ===================================================================== */
  .topbar { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--c-line); }
  .topbar-in { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); min-height: 64px; }
  .brand { font-weight: var(--fw-bold); font-size: var(--fs-l); color: var(--c-forest); text-decoration: none; letter-spacing: -.01em; white-space: nowrap; }
  .topnav { display: flex; align-items: center; gap: var(--s-5); font-size: var(--fs-s); font-weight: var(--fw-semi); }
  .topnav a { color: var(--c-ink); text-decoration: none; }
  .topnav a:hover { color: var(--c-green); }
  .topnav .deal { background: var(--c-mint); color: var(--c-forest); padding: 4px 10px; }
  @media (max-width: 700px) { .topnav a:not(.deal) { display: none; } }
  .strip { display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--s-3); margin-top: var(--s-4); padding: var(--s-4) var(--s-5); background: var(--c-surface); color: var(--c-forest); text-decoration: none; }
  .strip-lbl { flex-basis: 100%; font-size: var(--fs-sm); color: var(--c-ink); }
  .strip-t { font-size: var(--fs-l); font-weight: var(--fw-semi); }
  .chev { font-size: 1.5rem; line-height: 1; }
  a.strip:hover .strip-t { text-decoration: underline; }
  .strip-cta { margin-top: var(--s-7); }
  .strip-cta .cta-nums { margin-left: auto; }
  .hero { padding-top: var(--s-6); }
  .hero h1 { font-size: clamp(1.9rem, 1.3rem + 2.4vw, 3rem); line-height: 1.15; letter-spacing: -.02em; color: var(--c-ink); font-weight: var(--fw-semi); }
  .hero h1 .g { color: var(--c-forest); }
  .hero .intro { font-size: var(--fs-m); color: var(--c-ink); }
  .hero-actions { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: var(--s-5) 0 0; }
  .btn-ghost { background: #fff; color: var(--c-forest); border: 2px solid var(--c-forest); box-shadow: none; }
  .hero-img { margin: 0; aspect-ratio: 16 / 10; overflow: hidden; background: var(--c-surface); }
  .hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .b-title small { text-transform: uppercase; letter-spacing: .06em; font-size: var(--fs-xs); font-weight: var(--fw-semi); color: var(--c-ink); order: -1; }

  /* ===== FINAL: weicher, ruhiger, ohne Datum oben ===== */
  .strip-t, .hero .intro { text-wrap: balance; }

}

function jumpTo(nr, app) {
  const card = $(`#b-card-${nr}`, app);
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  card.focus({ preventScroll: true });
  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 1600);
}

function renderB(app) {
  const cards = visible().map(b => {
    const k = b.fromFreising.min, r = dur(b).min;
    return `
    <article class="b-card" id="b-card-${b.nr}" tabindex="-1">
      ${media(b, b.fav ? '<span class="fav-badge">★ Mein Favorit</span>' : '')}
      <div class="b-body">
        <div class="b-title"><span class="nr">${b.nr}</span><div><h3>${esc(b.name)}</h3><small>${esc(b.ort)}</small></div></div>
        <div class="b-meta">${stars(b)} <span class="cnt">${b.count} Bewertungen</span><span class="do${isLate(b) ? ' late' : ''}">Do ${doTimes(b)}</span></div>
        <div>
          <div class="split-lbl"><span class="k">ab Freising <b>${k} Min.</b></span><span class="r">ab ${O().name} <b>${r} Min.</b></span></div>
          <div class="split" aria-hidden="true"><span class="sk" style="flex:${k}"></span><span class="sr2" style="flex:${r}"></span></div>
          ${origin === 'ush' ? `<p class="home">Heimweg nach Regensburg: <b>${b.fromRegensburg.min} Min.</b></p>` : ''}
        </div>
        ${b.gut[0] ? quote(b.gut[0], false) : '<div></div>'}
        ${b.kritisch[0] ? quote(b.kritisch[0], true) : `<p class="q none">Keine kritische Stimme gefunden.</p>`}
        ${b.hinweis ? hinweis(b) : '<div></div>'}
        ${links(b)}
      </div>
    </article>`;
  }).join('');

  app.innerHTML = `
    ${hero()}
    <main>
      <section class="block wrap" aria-labelledby="route-title">
        <p class="eyebrow">Strecke</p>
        <h2 class="sec" id="route-title">Wo liegt die Mitte?</h2>
        <p class="hint">Jede Bar sitzt dort auf der Strecke, wo sich die Fahrzeit für uns beide aufteilt. Gezählt wird von dir aus, Nummer antippen springt zur Bar.</p>
        <div class="origin" role="group" aria-label="Wo startest du?">
          <span class="origin-lbl">Dein Start:</span>
          <div class="seg">${Object.entries(ORIGINS).map(([k, o]) => `<button type="button" class="origin-btn" data-origin="${k}" aria-pressed="${k === origin}">${o.name}</button>`).join('')}</div>
        </div>
        ${origin === 'ush' ? '<p class="hint">Ab Unterschleißheim zeige ich eine eigene Auswahl mit zwei Bars, die näher an dir liegen. Deinen Heimweg nach Regensburg siehst du auf jeder Karte.</p>' : ''}
        <div class="b-route">
          ${routeHorizontal()}
          ${routeVertical()}
          <p class="b-cap">Je näher an der Mitte, desto fairer ist die Fahrt verteilt. Lage nach Anteil der Fahrzeit, nicht nach Karte.</p>
        </div>
      </section>
      <section class="block wrap" aria-labelledby="cards-title">
        <p class="eyebrow">Die Kandidaten</p>
        <h2 class="sec" id="cards-title">Vier Bars zur Wahl.</h2>
        <div class="b-cards">${cards}</div>
      </section>
      <section class="wrap" aria-label="Rückmeldung"><div class="strip strip-cta"><span class="strip-lbl">Deine Rückmeldung · Start in ${O().name}</span><span class="strip-t">Gefunden? Tipp auf deine Bar. WhatsApp öffnet sich mit deiner Wahl, die Uhrzeit ergänzt du dort.</span><ol class="cta-nums">${visible().map(b => `<li><a href="${esc(waLink(b))}" target="_blank" rel="noopener" aria-label="Nr. ${b.nr}, ${esc(b.name)}: Wahl per WhatsApp schicken"><span class="cn" aria-hidden="true">${b.nr}</span><span class="cname">${esc(b.name)}</span></a></li>`).join('')}</ol></div></section>
      ${serviceCheck()}
    </main>
    ${footer()}`;

  $$('.origin-btn', app).forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.origin === origin) return;
    origin = btn.dataset.origin;
    const y = window.scrollY;
    renderB(app);
    window.scrollTo(0, y);
    const again = $(`.origin-btn[data-origin="${origin}"]`, app);
    if (again) again.focus({ preventScroll: true });
    try {
      const url = new URL(location.href);
      if (origin === 'regensburg') url.searchParams.delete('ab'); else url.searchParams.set('ab', O().param);
      history.replaceState(null, '', url);
    } catch (e) { /* z. B. in Vorschauen ohne echte URL */ }
  }));
  $$('.b-pt', app).forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    jumpTo(a.dataset.nr, app);
  }));
}

renderB(document.getElementById('app'));
</script>
</body>
</html>
